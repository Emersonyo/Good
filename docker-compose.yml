version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: emerson-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db

  server:
    build: ./server
    container_name: emerson-server
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://admin:password@mongodb:27017/emerson?authSource=admin
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: gpt-4o-mini
      LLM_TEMPERATURE: '0.2'
      LLM_MAX_TOKENS: '800'
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

volumes:
  mongodb_data:
